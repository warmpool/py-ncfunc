[project]
name = "ncfunc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lkkbox", email = "mail@mail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datenum",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
]

[project.scripts]
ncfunc = "ncfunc:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["N802", "N803", "N806", "N815", "N816"]

[tool.uv.sources]
datenum = { path = "/home/lkkbox/projects/py-datenum", editable = true }
