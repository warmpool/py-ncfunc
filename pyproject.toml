[project]
name = "ncfunc"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "warmpool", email = "mail@mail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datenum>=0.1.0",
    "netcdf4>=1.7.3",
    "numpy>=1.24",
]

[project.scripts]
ncfunc = "ncfunc:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["N802", "N803", "N806", "N815", "N816"]

[project.urls]
Homepage = "https://github.com/warmpool/py-ncfunc"
